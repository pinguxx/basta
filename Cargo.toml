[package]
name = "basta"
version = "0.1.0"
edition = "2021"
authors = ["pinguxx"]
description = "✏️ Basta Online (Stop / Tutti Frutti) • Clásico Juego de Palabras en Rust (Axum, Tokio, WebSockets)"
license = "MIT"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = "=0.7.20"
hyper-util = "=0.1.21"
tower-http = { version = "=0.7.1", features = ["fs", "cors", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
